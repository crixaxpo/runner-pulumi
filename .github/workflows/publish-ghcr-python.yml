name: Publish Python runner to GHCR

on:
  workflow_dispatch:
    inputs:
      pulumi_version:
        description: "Pulumi version to install, for example 3.239.0 or v3.239.0"
        required: true
        type: string
      image_tag:
        description: "Image tag to publish. Defaults to the Pulumi version."
        required: false
        type: string
      publish_latest:
        description: "Also publish the latest tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  publish-python:
    name: Build and publish Python runner
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set image metadata
        run: |
          PULUMI_VERSION="${{ inputs.pulumi_version }}"
          if [ "${PULUMI_VERSION#v}" = "$PULUMI_VERSION" ]; then
            PULUMI_VERSION="v$PULUMI_VERSION"
          fi
          echo "PULUMI_VERSION=$PULUMI_VERSION" >> "$GITHUB_ENV"

          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            IMAGE_TAG="${{ inputs.pulumi_version }}"
            echo "IMAGE_TAG=${IMAGE_TAG#v}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base Debian image
        uses: docker/build-push-action@v6
        with:
          context: base-debian
          push: true
          platforms: linux/amd64
          build-args: |
            PULUMI_VERSION=${{ env.PULUMI_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/runner-pulumi-base-debian:${{ env.IMAGE_TAG }}

      - name: Build and push Python image
        uses: docker/build-push-action@v6
        with:
          context: python
          push: true
          platforms: linux/amd64
          build-args: |
            REPOSITORY_BASE_PATH=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}
            RELEASE_VERSION=${{ env.IMAGE_TAG }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/runner-pulumi-python:${{ env.IMAGE_TAG }}

      - name: Tag Python image as latest
        if: ${{ inputs.publish_latest }}
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/runner-pulumi-python:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/runner-pulumi-python:${{ env.IMAGE_TAG }}
